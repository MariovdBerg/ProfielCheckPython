line-length = 120
target-version = "py39"
# Mappen met eigen code, zodat imports van prflcheck als first-party worden gesorteerd
src = ["src", "."]

[lint]
select = ["E", "F", "W", "B", "I", "UP"]
# De foutmeldingen in ProfielError zijn bewust lange regels
per-file-ignores = { "src/prflcheck/profiel_enums.py" = ["E501"] }
